<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Jalan - PT. Pasir Indah Logistik</title>
    <style>
        /* Reset & Base */
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            min-height: 100vh;
        }

        /* Layout: Sidebar (Input) & Main (Preview) */
        .app-container {
            display: flex;
            width: 100%;
        }
        
        /* Input Panel (Hidden on Print) */
        .input-panel {
            width: 350px;
            background-color: #333;
            color: white;
            padding: 20px;
            overflow-y: auto;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            z-index: 100;
        }
        .input-panel h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaa; }
        .form-control {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            background-color: #444;
            color: white;
            border-radius: 4px;
        }
        .form-control:focus { outline: none; border-color: #4a90e2; }
        .btn-print {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            font-size: 16px;
        }
        .btn-print:hover { background-color: #357abd; }

        /* Preview Area */
        .preview-area {
            flex-grow: 1;
            margin-left: 350px; /* Width of sidebar */
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* The Paper (A4) */
        .page {
            width: 210mm;
            min-height: 297mm;
            padding: 10mm 15mm;
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Print Styles */
        @media print {
            body { background-color: white; display: block; }
            .input-panel { display: none; }
            .preview-area { margin: 0; padding: 0; display: block; }
            .page {
                box-shadow: none;
                margin: 0;
                width: auto;
                height: auto;
                page-break-after: always;
            }
        }

        /* Surat Jalan Styles (from previous step) */
        .header { display: flex; border: 1px solid black; margin-bottom: 5px; }
        .logo-section { width: 35%; border-right: 1px solid black; padding: 10px; display: flex; justify-content: center; align-items: center; }
        .logo-placeholder { text-align: center; }
        .logo-circle { width: 100px; height: 100px; border: 2px solid red; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto; position: relative; }
        .logo-text-pi { font-size: 48px; font-weight: bold; font-style: italic; color: black; }
        .title-section { width: 65%; padding: 10px; display: flex; flex-direction: column; }
        .kepada-yth { font-weight: bold; font-size: 16px; margin-bottom: 5px; text-align: center; }
        .address-box { min-height: 60px; font-size: 14px; white-space: pre-wrap; margin-bottom: 10px; line-height: 1.5; }
        .address-lines .line { border-bottom: 1px solid black; height: 20px; margin-bottom: 5px; }
        .surat-jalan-title { font-size: 24px; font-weight: bold; text-align: center; text-transform: uppercase; margin-top: auto; margin-bottom: 10px; }
        
        .info-fields { display: flex; border: 1px solid black; border-top: none; padding: 5px 10px; font-size: 14px; }
        .col-left, .col-right { width: 50%; display: flex; flex-direction: column; gap: 5px; }
        .field-row { display: flex; align-items: flex-end; padding: 2px 0; }
        .field-label { min-width: 110px; }
        .field-value { flex-grow: 1; border-bottom: 1px dotted black; margin-left: 5px; padding-left: 5px; min-height: 18px; font-weight: bold;}

        .items-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .items-table th, .items-table td { border: 1px solid black; padding: 8px; text-align: center; font-size: 12px; }
        .items-table th { font-weight: bold; text-transform: uppercase; background-color: #eee; }
        .items-table td { height: 30px; }
        
        .footer { margin-top: 50px; display: flex; justify-content: space-between; padding: 0 20px; }
        .signature-box { text-align: center; width: 200px; }
        .signature-space { height: 80px; }
        .signature-date { margin-bottom: 5px; font-weight: bold; }

        /* Mobile Responsive Styles */
        @media screen and (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .input-panel {
                width: 100%;
                height: auto;
                position: relative;
                box-shadow: none;
                border-bottom: 1px solid #444;
                padding-bottom: 20px;
                overflow-y: visible;
            }
            .preview-area {
                margin-left: 0;
                padding: 10px;
                width: 100%;
                overflow-x: auto; /* Allow horizontal scroll for the A4 paper */
                background-color: #555; /* Darker background to pop the paper */
                display: block; /* Ensure block formatting context */
            }
            .page {
                min-width: 210mm; /* Keep fixed width for accuracy */
                margin: 0 auto;
                transform-origin: top left;
                /* Optional: Scale down slightly if preferred, but scrolling is safer for data check */
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Input Form -->
    <div class="input-panel">
        <h2>Input Data Surat Jalan</h2>
        
        <div class="form-group">
            <label>Kepada Yth (Alamat):</label>
            <textarea id="input-kepada" class="form-control" rows="3" oninput="updatePreview()"></textarea>
        </div>

        <div class="form-group">
            <label>Nama Kapal:</label>
            <input type="text" id="input-kapal" class="form-control" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>No. Truk Trailer:</label>
            <input type="text" id="input-truk" class="form-control" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Pengemudi:</label>
            <input type="text" id="input-pengemudi" class="form-control" oninput="updatePreview()">
        </div>

        <hr style="border-color: #555;">

        <div class="form-group">
            <label>DO Dari:</label>
            <input type="text" id="input-do-dari" class="form-control" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>DO No:</label>
            <input type="text" id="input-do-no" class="form-control" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Order No:</label>
            <input type="text" id="input-order-no" class="form-control" oninput="updatePreview()">
        </div>

        <hr style="border-color: #555;">
        <h3>Data Barang</h3>
        <!-- Simple dynamic row inputs for now, let's do 1 row for simplicity in sidebar, or multiple fixed -->
        <div id="items-inputs">
            <!-- Will be populated by JS -->
        </div>
        <button onclick="addItemRow()" style="background:#555; color:white; border:none; padding:5px 10px; cursor:pointer; width:100%; margin-bottom:10px;">+ Tambah Baris</button>

        <div class="form-group">
            <label>Tanggal:</label>
            <input type="text" id="input-tanggal" class="form-control" placeholder="DD/MM/YYYY" oninput="updatePreview()">
        </div>

        <button class="btn-print" onclick="window.print()">🖨️ CETAK / PDF</button>
    </div>

    <!-- Preview Area -->
    <div class="preview-area">
        <div class="page">
            <!-- Header -->
            <div class="header">
                <div class="logo-section">
                    <div class="logo-placeholder">
                        <img src="LOGOPI.jpg" alt="Logo PT. Pasir Indah Logistik" style="max-width: 100%; max-height: 150px; object-fit: contain;">
                    </div>
                </div>
                <div class="title-section">
                    <div class="kepada-yth" style="text-align: center;">Kepada Yth :</div>
                    <div class="address-box" id="preview-kepada">
                        <!-- Address lines will be simulated with border-bottom in CSS if empty, or text if filled -->
                        <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                        <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                        <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                    </div>
                    <div class="surat-jalan-title">SURAT JALAN</div>
                </div>
            </div>

            <!-- Info Fields -->
            <div class="info-fields">
                <div class="col-left">
                    <div class="field-row">
                        <span class="field-label">Nama Kapal</span>:
                        <span class="field-value" id="preview-kapal"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">No. Truk Trailer</span>:
                        <span class="field-value" id="preview-truk"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">Pengemudi</span>:
                        <span class="field-value" id="preview-pengemudi"></span>
                    </div>
                </div>
                <div class="col-right" style="padding-left: 20px;">
                    <div class="field-row">
                        <span class="field-label" style="min-width: 80px;">DO dari</span>:
                        <span class="field-value" id="preview-do-dari"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label" style="min-width: 80px;">DO No</span>:
                        <span class="field-value" id="preview-do-no"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label" style="min-width: 80px;">Order No</span>:
                        <span class="field-value" id="preview-order-no"></span>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <table class="items-table">
                <thead>
                    <tr>
                        <th style="width: 5%;">NO.</th>
                        <th style="width: 25%;">CONTAINER</th>
                        <th style="width: 15%;">NO SEAL</th>
                        <th style="width: 15%;">SIZE 20/40</th>
                        <th style="width: 15%;">TUJUAN</th>
                        <th style="width: 10%;">GUDANG</th>
                        <th style="width: 15%;">KETERANGAN</th>
                    </tr>
                </thead>
                <tbody id="preview-table-body">
                    <!-- Rows will be generated by JS -->
                </tbody>
            </table>

            <!-- Footer -->
            <div class="footer">
                <div class="signature-box">
                    <div class="signature-space"></div>
                    <div>Tanda tangan Penerima</div>
                </div>
                <div class="signature-box">
                    <div class="signature-space"></div>
                    <div>Tanda tangan Sopir</div>
                </div>
                <div class="signature-box">
                    <div class="signature-space" style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;">
                        Bandung, <span id="preview-tanggal" style="margin: 0 5px; border-bottom: 1px dotted black; min-width: 100px; display: inline-block; text-align: center;"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize with 5 rows
        const initialRows = 5;
        let rowCount = 0;

        function init() {
            const tableBody = document.getElementById('preview-table-body');
            const itemsInputs = document.getElementById('items-inputs');
            
            // Clear existing
            tableBody.innerHTML = '';
            itemsInputs.innerHTML = '';
            rowCount = 0;

            for(let i=0; i<initialRows; i++) {
                addItemRow();
            }

            // Set default date
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
            const yyyy = today.getFullYear();
            const dateStr = dd + '/' + mm + '/' + yyyy;
            document.getElementById('input-tanggal').value = dateStr;
            updatePreview();
        }

        function addItemRow() {
            rowCount++;
            const id = rowCount;
            
            // Add Input Fields
            const inputDiv = document.createElement('div');
            inputDiv.className = 'form-group';
            inputDiv.style.border = '1px dashed #555';
            inputDiv.style.padding = '5px';
            inputDiv.innerHTML = `
                <label>Baris ${id}</label>
                <div style="display:flex; gap:5px; margin-bottom:5px;">
                    <input type="text" class="form-control" placeholder="Container" oninput="updateRow(${id})" id="in-cont-${id}">
                    <input type="text" class="form-control" placeholder="Seal" oninput="updateRow(${id})" id="in-seal-${id}">
                </div>
                <div style="display:flex; gap:5px;">
                    <input type="text" class="form-control" placeholder="Size" style="width:60px" oninput="updateRow(${id})" id="in-size-${id}">
                    <input type="text" class="form-control" placeholder="Tujuan" oninput="updateRow(${id})" id="in-dest-${id}">
                    <input type="text" class="form-control" placeholder="Gudang" style="width:60px" oninput="updateRow(${id})" id="in-wh-${id}">
                </div>
                <input type="text" class="form-control" placeholder="Keterangan" style="margin-top:5px;" oninput="updateRow(${id})" id="in-rem-${id}">
            `;
            document.getElementById('items-inputs').appendChild(inputDiv);

            // Add Table Row
            const tr = document.createElement('tr');
            tr.id = `row-${id}`;
            tr.innerHTML = `
                <td>${id}</td>
                <td id="out-cont-${id}"></td>
                <td id="out-seal-${id}"></td>
                <td id="out-size-${id}"></td>
                <td id="out-dest-${id}"></td>
                <td id="out-wh-${id}"></td>
                <td id="out-rem-${id}"></td>
            `;
            document.getElementById('preview-table-body').appendChild(tr);
        }

        function updateRow(id) {
            document.getElementById(`out-cont-${id}`).textContent = document.getElementById(`in-cont-${id}`).value;
            document.getElementById(`out-seal-${id}`).textContent = document.getElementById(`in-seal-${id}`).value;
            document.getElementById(`out-size-${id}`).textContent = document.getElementById(`in-size-${id}`).value;
            document.getElementById(`out-dest-${id}`).textContent = document.getElementById(`in-dest-${id}`).value;
            document.getElementById(`out-wh-${id}`).textContent = document.getElementById(`in-wh-${id}`).value;
            document.getElementById(`out-rem-${id}`).textContent = document.getElementById(`in-rem-${id}`).value;
        }

        function updatePreview() {
            // Text Inputs
            document.getElementById('preview-kapal').textContent = document.getElementById('input-kapal').value;
            document.getElementById('preview-truk').textContent = document.getElementById('input-truk').value;
            document.getElementById('preview-pengemudi').textContent = document.getElementById('input-pengemudi').value;
            
            document.getElementById('preview-do-dari').textContent = document.getElementById('input-do-dari').value;
            document.getElementById('preview-do-no').textContent = document.getElementById('input-do-no').value;
            document.getElementById('preview-order-no').textContent = document.getElementById('input-order-no').value;
            
            document.getElementById('preview-tanggal').textContent = document.getElementById('input-tanggal').value;

            // Address Handling
            const addrInput = document.getElementById('input-kepada').value;
            const addrPreview = document.getElementById('preview-kepada');
            if(addrInput.trim()) {
                // Replace newlines with <br>
                addrPreview.innerHTML = addrInput.replace(/\n/g, '<br>');
                addrPreview.style.borderBottom = 'none';
            } else {
                // Show lines if empty
                addrPreview.innerHTML = `
                    <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                    <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                    <div style="border-bottom:1px solid black; height:20px; margin-bottom:5px;"></div>
                `;
            }
        }

        // Init
        window.onload = init;

    </script>
</body>
</html>
